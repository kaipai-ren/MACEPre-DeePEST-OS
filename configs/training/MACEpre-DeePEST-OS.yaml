# MACEPre-DeePEST-OS fine-tuning configuration.
# Paper training configuration.

model: MACE
stress_weight: 0.0
forces_weight: 100.0
energy_weight: 10.0
foundation_model: ./MACE-omol-0-extra-large-1024.model
multiheads_finetuning: false
foundation_model_elements: true
E0s: foundation
name: MACEpre-DeePEST-OS
model_dir: ./naive_models
log_dir: ./naive_models
checkpoints_dir: ./naive_models
results_dir: ./naive_models
train_file: ./qbc-35w.xyz
valid_fraction: 0.05
energy_key: energy
forces_key: forces
default_dtype: float64
device: cuda
batch_size: 40
max_num_epochs: 50
